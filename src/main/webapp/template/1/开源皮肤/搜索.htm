<script>
    $("#w-id-2013547212201037825-1772413346000_36980").pagination({
        currentPage: ${(page.cur)!1},// 当前页数
        totalPage: ${(page.total)!0},// 总页数
        isShow: true,// 是否显示首尾页
        count: 4,// 控制分页组件中同时显示的页码按钮数量
        homePageText: "首页",// 首页文本
        endPageText: "尾页",// 尾页文本
        prevPageText: "上一页",// 上一页文本
        nextPageText: "下一页",// 下一页文本
        showPrevOnFirst: true, // 在首页是否显示上一页
        showNextOnLast: true, // 在尾页是否显示下一页
        callback: function(current) {
            // 回调,current(当前页数)
            var forms = document.querySelectorAll('form[id^="w-search-form-"]');
            var form = forms.length > 0 ? forms[forms.length - 1] : null;
            var pageNoInput = form.querySelector('input[name="pageNo"]');
            if (!pageNoInput) {
                pageNoInput = document.createElement('input');
                pageNoInput.type = 'hidden';
                pageNoInput.name = 'pageNo';
                pageNoInput.value = current;
                form.appendChild(pageNoInput);
            }
            pageNoInput.value = current;
            form.submit();
        }
    });
</script>
