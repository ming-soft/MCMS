
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html" />
    <meta http-equiv="Pragma" CONTENT="no-cache" />
    <meta name="viewport" content="initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,width=device-width"/>
    <meta name="format-detection" content="telephone=no"/>
    <meta name="app-mobile-web-app-capable" content="yes"/>
    <meta name="app-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="format-detection" content="telephone=no"/>
    <title>{ms:global.name/}-${field.title}</title>
    <meta name="keywords" content="${field.keyword}">
    <meta name="description" content="${field.descrip}">

    <link href="{@ms:file global.ico/}" rel="shortcut icon"/>

    <link rel="stylesheet" href="${base}/static/plugins/minireset/0.0.2/minireset.min.css" />
    <link rel="stylesheet" href="${base}/static/plugins/iconfont/1.0.0/iconfont.css" />
    <link rel="stylesheet" href="${base}/static/plugins/animate/4.1.0/animate.min.css">
    <link rel="stylesheet" href="${base}/static/plugins/hover/2.3.1/hover-min.css" />


    <link  rel="stylesheet" href="${base}/static/plugins/swiper/12.1.3/swiper-bundle.min.css" />
    <script src="${base}/static/plugins/swiper/12.1.3/swiper-bundle.min.js"></script>

    <script src="${base}/static/plugins/jquery/3.6.3/jquery-3.6.3.min.js"></script>
    <script src="${base}/static/plugins/jquery.pagination/1.0.0/jquery.pagination.min.js"></script>

    <!-- 引入 Layer 的核心文件 -->
    <link rel="stylesheet" href="${base}/static/plugins/layer/3.5.1/theme/default/layer.min.css" />
    <script src="${base}/static/plugins/layer/3.5.1/layer.min.js"></script>


    <!--全局样式 app.css-->
    <link rel="stylesheet" href="${base}/{ms:global.style/}css/app.css" />

    <script src="//cdn.mingsoft.net/designer/1.0.0/ms.designer.min.js"></script>
    <!--页面分享-->
    <script src="/static/plugins/sharejs/1.0.16/social-share.min.js"></script>
    <link rel="stylesheet" href="/static/plugins/sharejs/1.0.16/share.min.css" />
</head>
<body>
<#include "头部.htm"/>
<div class="top-bg" style="background-image: url({@ms:file field.typelitpic/})">
    <span class="swiper-title"> ${field.typetitle} </span>
</div>
<!--内容-start-->
<div class="news-bg">
    <div class="content_area">
        <!--间隔-start-->
        <div class="space"></div>
        <!--间隔-end-->
        <span class="title"> ${field.title} </span> <!--时间+人气-start-->
        <div class="con-line">
            <!--时间-start-->
            <div class="time-box">
                <span class="time"> 时间： </span> <span class="time"> ${field.date?string("yyyy-MM-dd")} </span>
            </div>
            <!--时间-end-->
            <!--人气-start-->
            <div class="time-box">
                <span class="time"> 人气： </span> <span class="time"> ${field.hit} </span>
            </div>
            <!--人气-end-->
        </div>
        <!--时间+人气-end-->
        <div class="content_box">
            <span class="content"> ${field.content} </span>
        </div>
        <!--间隔-start-->
        <div class="space"></div>
        <!--间隔-end-->
        <div class="prenext-area">
            <!--上一篇-start-->
            <div class="prenext">
                <span class="text"> 上一篇： </span> <a href="<#if pre.link?has_content>{ms:global.html/}${pre.link}<#else>javascript:;</#if>" target="<#if pre.link?has_content>_blank</#if>" class="tit"> ${pre.title?default("暂无")} </a>
            </div>
            <!--上一篇-end-->
            <!--下一篇-start-->
            <div class="prenext">
                <span class="text"> 下一篇： </span> <a href="<#if next.link?has_content>{ms:global.html/}${next.link}<#else>javascript:;</#if>" target="<#if next.link?has_content>_blank</#if>" class="tit"> ${next.title?default("暂无")} </a>
            </div>
            <!--下一篇-end-->
        </div>
    </div>
</div>
<!--内容-end-->
<#include "底部.htm"/>
<style>
    /*页面css*/
    
    /*PC端响应式*/
    
    .top-bg {
        width:100%;
        height:440px;
        flex-shrink:0;
        box-sizing:border-box;
        position:relative;
        flex-direction:column;
        display:flex;
        background-image:url('/{ms:global.style/}images/2034507316526583808.jpg');
        background-position:center;
        background-repeat:no-repeat;
        background-size:cover;
        align-items:center;
        justify-content:center;
    }
    
    .swiper-title {
        flex-direction:row;
        display:-webkit-inline-box;
        word-wrap:break-word;
        -webkit-line-clamp:0;
        -webkit-box-orient:vertical;
        font-size:60px;
        color:rgba(255, 255, 255, 1);
        font-weight:600;
    }
    
    .news-bg {
        width:100%;
        flex-shrink:0;
        box-sizing:border-box;
        position:relative;
        flex-direction:column;
        display:flex;
        align-items:center;
    }
    
    .news-bg .prenext .tit:hover{
        color:#00a1e9
    }
    
    .content_area {
        width:80%;
        height:100%;
        flex-shrink:0;
        box-sizing:border-box;
        position:relative;
        flex-direction:column;
        display:flex;
        max-width:1300px;
        align-items:center;
    }
    
    .news-bg .space {
        width:100%;
        height:100px;
        flex-shrink:0;
        box-sizing:border-box;
        position:relative;
    }
    
    .title {
        flex-direction:row;
        display:-webkit-inline-box;
        word-wrap:break-word;
        -webkit-line-clamp:0;
        -webkit-box-orient:vertical;
        font-size:24PX;
        color:rgba(51, 51, 51, 1);
        line-height:36px;
    }
    
    .con-line {
        width:100%;
        flex-shrink:0;
        box-sizing:border-box;
        position:relative;
        flex-direction:row;
        display:flex;
        justify-content:center;
        align-items:center;
        margin-bottom:15px;
        border-bottom-style:dashed;
        border-bottom-color:#CCCCCC;
        border-bottom-width:1px;
        padding-bottom:15px;
        margin-left:px;
        padding-left:px;
        padding-top:15px;
    }
    
    .time-box {
        flex-shrink:0;
        box-sizing:border-box;
        position:relative;
        flex-direction:row;
        display:flex;
        margin-right:5px;
    }
    
    .time {
        flex-direction:row;
        display:-webkit-inline-box;
        word-wrap:break-word;
        -webkit-line-clamp:0;
        -webkit-box-orient:vertical;
        font-size:12PX;
        color:rgba(153, 153, 153, 1);
    }
    
    .content_box {
        width:100%;
        flex-shrink:0;
        box-sizing:border-box;
        position:relative;
        flex-direction:column;
        display:flex;
        align-items:flex-start;
    }
    
    .content {
        flex-direction:row;
        display:-webkit-inline-box;
        word-wrap:break-word;
        -webkit-line-clamp:0;
        -webkit-box-orient:vertical;
        line-height:30px;
    }
    
    .prenext-area {
        width:100%;
        flex-shrink:0;
        box-sizing:border-box;
        position:relative;
        flex-direction:column;
        display:flex;
    }
    
    .prenext {
        width:100%;
        flex-shrink:0;
        box-sizing:border-box;
        position:relative;
        flex-direction:row;
        display:flex;
        margin-bottom:10px;
    }
    
    .prenext_area .text {
        flex-direction:row;
        display:-webkit-inline-box;
        word-wrap:break-word;
        -webkit-line-clamp:0;
        -webkit-box-orient:vertical;
        font-size:16PX;
        color:rgba(68, 68, 68, 1);
    }
    
    .prenext_area .tit {
        flex-direction:row;
        display:-webkit-inline-box;
        word-wrap:break-word;
        -webkit-line-clamp:0;
        -webkit-box-orient:vertical;
        font-size:16PX;
        color:rgba(68, 68, 68, 1);
    }
    
    /*H5端响应式*/
    
    @media (max-width: 768px) {
        .top-bg {
            height:250px;
        }
    
        .swiper-title {
            font-size:28PX;
        }
    
        .title {
            text-align:center;
        }
    
        .con-line {
            width:100%;
            flex-direction:row;
            display:flex;
            flex-wrap:wrap;
        }
    
        .prenext {
            flex-direction:row;
            display:flex;
            flex-wrap:wrap;
        }
    
    }
    
    /*iPad端响应式*/
    
    @media (min-width: 768px) and (max-width: 1024px) {
        .swiper-title {
            font-size:42PX;
        }
    
    }

</style>
</body>
</html>
